name: Docs

on:
  push:
    branches:
      - master
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish docs to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: docs-site
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: bun run build

      # 构建产物只发布到 gh-pages 分支，master 上不保存任何构建结果。
      # gh-pages 每次 force push 成单提交历史，避免产物历史膨胀。
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        working-directory: docs-site/.vitepress/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: 发布文档站 ${COMMIT_SHA:0:7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
